<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | NextGen Gaming</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }
        
        .contact-header {
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1523966211575-eb4a01e7dd51?q=80&w=1000');
            background-size: cover; 
            color: white; 
            padding: 80px 0;
            clip-path: polygon(0 0, 100% 0, 100% 90%, 0% 100%);
        }

        .form-control { border-radius: 10px; padding: 12px; border: 1px solid #ddd; }

        /* 社交媒体按钮增强版 */
        .social-btn { 
            border-radius: 50px; 
            width: 45px; 
            height: 45px; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            text-decoration: none; 
            color: white !important; /* 强制图标显示白色 */
            margin: 0 5px; 
            transition: 0.3s;
            font-size: 1.2rem; /* 让图标大小合适 */
        }
        
        .social-btn:hover { 
            transform: scale(1.1); 
            opacity: 0.9; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* 响应式调整：手机端地图不要太高 */
        @media (max-width: 768px) {
            .ratio-16x9 { --bs-aspect-ratio: 75%; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">NextGen Gaming</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="search.html">Search</a>
                <a class="nav-link" href="about.html">About</a>
                <a class="nav-link active" href="features.html">Features</a>
                <a class="nav-link" href="contact.html">Contact</a>
                <a class="nav-link" href="promotion.html">Promotions</a>
                <a class="nav-link" href="gallery.html">Gallery</a>
                <a class="nav-link" href="cart.html">
                <i class="bi bi-cart3" style="font-size: 1.2rem;"></i></a>
            </div>
        </div>
    </div>
</nav>

<header class="contact-header text-center">
    <div class="container">
        <h1 class="display-4 fw-bold">Get In Touch</h1>
        <p class="lead">Have questions? We're here to help.</p>
    </div>
</header>

<div class="container my-5">
    <div class="row g-5">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm p-4" style="border-radius: 20px;">
                <h3 class="fw-bold mb-4">Send us a message</h3>
                <form id="contactForm">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" placeholder="john@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" rows="4" placeholder="How can we help?" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 py-3 fw-bold" style="border-radius: 50px;">SEND MESSAGE</button>
                </form>
            </div>
        </div>

        <div class="col-lg-6 text-center text-lg-start">
            <h3 class="fw-bold mb-4">Connect With Us</h3>
            <p class="text-muted">Follow our social media for the latest gaming news and console updates.</p>
            
            <div class="mb-5">
                <a href="#" class="social-btn" style="background: #3b5998;" title="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="social-btn" style="background: #000000;" title="X"><i class="fab fa-x-twitter"></i></a>
                <a href="#" class="social-btn" style="background: #e1306c;" title="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" class="social-btn" style="background: #ff0000;" title="YouTube"><i class="fab fa-youtube"></i></a>
            </div>

            <h3 class="fw-bold mb-4">Our Hub</h3>
            <div class="ratio ratio-16x9 shadow-sm" style="border-radius: 20px; overflow: hidden; border: 1px solid #eee;">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3983.8967964245!2d101.68434687588665!3d3.1356501533158013!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31cc362abd714443%3A0x6d8590c961e6878b!2sKuala%20Lumpur%20Sentral!5e0!3m2!1sen!2smy!4v1710000000000!5m2!1sen!2smy" 
                    allowfullscreen="" 
                    loading="lazy" 
                    style="border:0;">
                </iframe>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center py-4 mt-5">
    <p class="mb-0">© 2026 NextGen Gaming Hub | CS Degree Assignment</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('contactForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Thank you! Your message has been sent successfully.');
        this.reset();
    });
</script>
</body>
</html>
